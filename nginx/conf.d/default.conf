server {
    listen 443 ssl;
    server_name cyberia-stg.ser-techsupport.local;

    ssl_certificate /etc/nginx/certs/webia.crt;
    ssl_certificate_key /etc/nginx/certs/webia.key;

    client_max_body_size 200m;

    # Toutes les requêtes API sont préfixées par /api/.
    # Le slash final de proxy_pass retire ce préfixe
    # avant de transmettre la requête à FastAPI.
    location ^~ /api/ {
        proxy_pass http://backend:8000/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Préserve les flux de progression SSE.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Toutes les autres URL sont des pages du frontend React.
    location / {
        proxy_pass http://frontend:80;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}