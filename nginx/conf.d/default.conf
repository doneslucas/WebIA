server {
  listen 443 ssl;
  server_name cyberia-stg.ser-techsupport.local;

  ssl_certificate /etc/nginx/certs/webia.crt;
  ssl_certificate_key /etc/nginx/certs/webia.key;

  location /api/ {
    proxy_pass http://backend:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /{
    proxy_pass http://frontend:5173;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/(profile|auth|documents|quiz|progress|dashboard)(/|$) {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
